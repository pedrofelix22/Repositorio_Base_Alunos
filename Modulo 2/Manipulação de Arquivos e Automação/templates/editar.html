<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar {{ jogo.nome }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<main class="container py-5" style="max-width: 720px;">
    <h1>Editar jogo</h1>
    <form method="post" class="bg-light text-dark p-4 rounded">
        <label class="form-label">Nome</label>
        <input name="nome" value="{{ jogo.nome }}" class="form-control mb-3" required>

        <label class="form-label">Gênero</label>
        <input name="genero" value="{{ jogo.genero }}" class="form-control mb-3" required>

        <label class="form-label">Nota</label>
        <input name="nota" type="number" min="0" max="10" step="0.1" value="{{ jogo.nota }}" class="form-control mb-3" required>

        <label class="form-label">URL da capa</label>
        <input name="imagem_url" type="url" value="{{ jogo.imagem_url }}" class="form-control mb-3">

        <button class="btn btn-success">Salvar</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</main>
</body>
</html>
