<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Biblioteca de Jogos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<main class="container py-5">
    <h1 class="mb-1">🎮 Biblioteca de Jogos</h1>
    <p class="text-secondary">Flask + SQLAlchemy + SQLite</p>

    <form action="{{ url_for('cadastrar') }}" method="post" class="row g-3 bg-secondary-subtle text-dark p-3 rounded mb-5">
        <div class="col-md-4">
            <label class="form-label">Nome</label>
            <input name="nome" class="form-control" required>
        </div>
        <div class="col-md-3">
            <label class="form-label">Gênero</label>
            <input name="genero" class="form-control" required>
        </div>
        <div class="col-md-2">
            <label class="form-label">Nota</label>
            <input name="nota" type="number" min="0" max="10" step="0.1" class="form-control" required>
        </div>
        <div class="col-md-3">
            <label class="form-label">URL da capa</label>
            <input name="imagem_url" type="url" class="form-control">
        </div>
        <div class="col-12">
            <button class="btn btn-success">Cadastrar jogo</button>
        </div>
    </form>

    <div class="row g-4">
        {% for jogo in jogos %}
        <div class="col-md-4">
            <article class="card h-100">
                {% if jogo.imagem_url %}
                <img src="{{ jogo.imagem_url }}" class="card-img-top" alt="Capa de {{ jogo.nome }}" style="height: 240px; object-fit: cover;">
                {% endif %}
                <div class="card-body">
                    <h2 class="h4">{{ jogo.nome }}</h2>
                    <p>{{ jogo.genero }} · ⭐ {{ jogo.nota }}/10</p>
                    <a href="{{ url_for('editar', jogo_id=jogo.id) }}" class="btn btn-primary">Editar</a>
                    <form action="{{ url_for('excluir', jogo_id=jogo.id) }}" method="post" class="d-inline">
                        <button class="btn btn-danger" onclick="return confirm('Excluir este jogo?')">Excluir</button>
                    </form>
                </div>
            </article>
        </div>
        {% else %}
        <p>Nenhum jogo cadastrado ainda.</p>
        {% endfor %}
    </div>
</main>
</body>
</html>
